name: Latest blog post workflow
on:
  schedule:
    # 매일 자정(UTC)에 워크플로우를 실행합니다.
    # 리눅스 cron 문법과 동일하며, '0 0 * * *'는 매일 00:00 UTC를 의미합니다.
    - cron: "0 0 * * *"
  workflow_dispatch:
    # GitHub Actions 페이지에서 수동으로 실행할 수 있게 합니다.

# 워크플로우가 README 파일을 수정할 수 있도록 권한을 부여합니다.
permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Pull in blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dayeon5952.github.io/feed.xml"
          readme_path: "./README.md"
          max_post_count: 5
          template: "- [$title]($url)"
          disable_html_encoding: "true"
          commit_message: "Updated blog posts"
          committer_username: "github-actions"
          committer_email: "github-actions@github.com"
      
      - name: Fix blog post formatting
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let content = fs.readFileSync('./README.md', 'utf8');
            
            // HTML 엔티티 디코딩
            content = content.replace(/&lpar;/g, '(');
            content = content.replace(/&rpar;/g, ')');
            content = content.replace(/&lsqb;/g, '[');
            content = content.replace(/&rsqb;/g, ']');
            content = content.replace(/&#40;/g, '(');
            content = content.replace(/&#41;/g, ')');
            
            // %0A 를 실제 줄바꿈으로 변환
            content = content.replace(/ %0A/g, '\n');
            
            // 이중 대괄호 제거 ([[ -> [)
            content = content.replace(/\[\[/g, '[');
            content = content.replace(/\]\]/g, ']');
            
            // 연속된 마크다운 링크들을 줄바꿈으로 분리
            // ](url)- [ 패턴을 ](url)\n- [ 로 변환
            content = content.replace(/\]\([^)]+\)- \[/g, (match) => {
              return match.replace('- [', '\n- [');
            });
            
            fs.writeFileSync('./README.md', content);
            console.log('Blog post formatting fixed!');
            console.log('Fixed content:');
            console.log(content.substring(0, 500));
      
      - name: Commit formatting fixes
        run: |
          cd .
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add README.md
            git commit --amend --no-edit || git commit -m "Fix: Blog post formatting"
            git push --force-with-lease
          fi
